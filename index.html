<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>V&V Deals Scout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="eyebrow">V & V</div>
      <h1>Deals Scout</h1>
      <p class="subtitle">Staycations, regional escapes, food and sales — ranked by how worthwhile they look.</p>
      <div class="status-row">
        <span id="updated">Loading latest scan…</span>
        <span id="demoBadge" class="badge warning" hidden>DEMO DATA</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" aria-label="Deal categories">
      <button class="tab active" data-filter="all">🔥 Best</button>
      <button class="tab" data-filter="idea">❤️ Ideas</button>
      <button class="tab" data-filter="hotel">🏨 Hotels</button>
      <button class="tab" data-filter="food">🍽️ Food</button>
      <button class="tab" data-filter="sale">🛍️ Sales</button>
    </nav>

    <section class="summary" id="summary"></section>
    <section id="deals" class="cards"></section>

    <section class="empty" id="empty" hidden>
      <h2>No deals above your threshold yet.</h2>
      <p>The next scheduled scan will check again.</p>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <p>V&V Deals Scout · Deal scores are decision aids, not price guarantees.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
