name: Daily Deals Scan

on:
  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Singapore"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V&V Deals Scout
        env:
          HOTELBEDS_API_KEY: ${{ secrets.HOTELBEDS_API_KEY }}
          HOTELBEDS_SECRET: ${{ secrets.HOTELBEDS_SECRET }}
          HOTELBEDS_CLIENT_CERT_B64: ${{ secrets.HOTELBEDS_CLIENT_CERT_B64 }}
          HOTELBEDS_CLIENT_KEY_B64: ${{ secrets.HOTELBEDS_CLIENT_KEY_B64 }}
          HOTELBEDS_CLIENT_KEY_PASSWORD: ${{ secrets.HOTELBEDS_CLIENT_KEY_PASSWORD }}
        run: python scripts/main.py

      - name: Commit refreshed deal data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Daily deals scan"
            git push
          fi
