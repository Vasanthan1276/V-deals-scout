name: Sales Scanner Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sales-scanner:
    name: Test live Sales scanner only
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Sales scanner only
        env:
          SALES_SCAN_TIMEOUT_SECONDS: "20"
          SALES_SCAN_MIN_DISCOUNT: "15"
          SALES_SCAN_MAX_ITEMS: "30"
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          repo_root = Path.cwd()
          scripts_dir = repo_root / "scripts"
          sys.path.insert(0, str(scripts_dir))

          from sales_scanner import scan_sales

          print("=" * 72)
          print("V&V DEALS SCOUT - SALES-ONLY TEST")
          print("This workflow does NOT import or run the Hotelbeds scanner.")
          print("=" * 72)

          items = scan_sales()

          output_path = repo_root / "data" / "sales-test.json"
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(
              json.dumps(items, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )

          demo_items = [item for item in items if item.get("is_demo")]
          live_items = [item for item in items if not item.get("is_demo")]
          deal_types = sorted({
              item.get("deal_type", "other")
              for item in live_items
          })
          official_direct = [
              item for item in live_items
              if item.get("deal_type") in {
                  "direct_brand", "direct_retailer", "mall_outlet"
              }
          ]
          direct_brand = [
              item for item in live_items
              if item.get("deal_type") == "direct_brand"
          ]
          discovery = [
              item for item in live_items
              if item.get("deal_type") == "discovery"
          ]
          explained_items = [
              item for item in live_items
              if item.get("score_breakdown")
              and item.get("score_breakdown", {}).get("components")
          ]

          print("")
          print("=" * 72)
          print("SALES-ONLY TEST SUMMARY")
          print("=" * 72)
          print(f"Total items returned: {len(items)}")
          print(f"Live items:           {len(live_items)}")
          print(f"Demo items:           {len(demo_items)}")
          print(f"Deal/source types:    {deal_types}")
          print(f"Official direct/mall: {len(official_direct)}")
          print(f"Direct-brand deals:   {len(direct_brand)}")
          print(f"Discovery deals:      {len(discovery)}")
          print(f"Explained scores:     {len(explained_items)}")
          print(f"Test output:          {output_path}")

          if demo_items:
              raise SystemExit(
                  "Sales scanner returned demo entries. Live scanner validation failed."
              )

          if not live_items:
              raise SystemExit(
                  "Sales scanner returned zero live deals. Inspect the Sales scanner log "
                  "above before publishing anything."
              )

          if not official_direct:
              raise SystemExit(
                  "Official Sales expansion validation failed: no direct brand, "
                  "direct retailer or mall/outlet deals were returned."
              )

          if len(official_direct) < 4:
              raise SystemExit(
                  "Official-source diversity validation failed: fewer than 4 "
                  "Direct Brand / Direct Retailer / Mall-Outlet deals were returned."
              )

          if not direct_brand:
              print(
                  "WARNING: No Direct Brand deal was publishable in this run. "
                  "Brand sites may block automated requests or render sale data "
                  "dynamically. This is non-fatal because official Direct Retailer "
                  "and Mall/Outlet sources are still validated separately."
              )

          if len(discovery) > 12:
              raise SystemExit(
                  "Sales diversity validation failed: Discovery exceeded the hard "
                  "publication cap of 12 deals."
              )

          if len(explained_items) != len(live_items):
              raise SystemExit(
                  "Explainable-score validation failed: one or more Sales deals "
                  "did not include score_breakdown components."
              )

          print("")
          print("Top live Sales deals:")
          for index, item in enumerate(live_items[:12], start=1):
              print(
                  f"{index:>2}. {item.get('name', 'Unknown')} | "
                  f"{item.get('subcategory', 'sale')} | "
                  f"{item.get('discount_percent', 0)}% off | "
                  f"score {item.get('deal_score', 0)} | "
                  f"{item.get('location', 'Singapore')}"
              )

          print("")
          print("SALES SCANNER LIVE TEST PASSED")
          PY

      - name: Upload Sales test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-scanner-test-output
          path: data/sales-test.json
          if-no-files-found: ignore
          retention-days: 7
