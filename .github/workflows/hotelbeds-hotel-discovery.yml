name: Discover Hotelbeds Hotels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover Hotelbeds hotel codes
        env:
          HOTELBEDS_API_KEY: ${{ secrets.HOTELBEDS_API_KEY }}
          HOTELBEDS_SECRET: ${{ secrets.HOTELBEDS_SECRET }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import hashlib
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          API_KEY = os.environ["HOTELBEDS_API_KEY"]
          SECRET = os.environ["HOTELBEDS_SECRET"]

          ROOT = Path(".")
          CONFIG_HOTELS = ROOT / "config" / "hotels.json"
          OUTPUT = ROOT / "data" / "hotelbeds-discovery.json"

          # Initial destination codes used by Deals Scout.
          destinations = [
              {"name": "Singapore",       "code": "SIN"},
              {"name": "Penang",          "code": "PEN"},
              {"name": "Kuala Lumpur",    "code": "KUL"},
              {"name": "Bangkok",         "code": "BKK"},
              {"name": "Bali",            "code": "DPS"},
              {"name": "Batam",           "code": "BTH"},
              {"name": "Bintan",          "code": "TNJ"},
          ]

          # Load our existing preferred hotel watchlist.
          watchlist = []

          if CONFIG_HOTELS.exists():
              with open(CONFIG_HOTELS, "r", encoding="utf-8") as f:
                  cfg = json.load(f)

              watchlist = cfg.get("watchlist", [])

          def normalise_text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  for key in (
                      "content",
                      "description",
                      "name",
                      "value",
                      "text"
                  ):
                      if key in value:
                          return normalise_text(value[key])

              return str(value).strip()

          def hotel_stars(hotel):
              category = (
                  hotel.get("categoryCode")
                  or hotel.get("category")
                  or ""
              )

              category = normalise_text(category)

              if category and category[0].isdigit():
                  try:
                      value = int(category[0])
                      if 1 <= value <= 5:
                          return value
                  except ValueError:
                      pass

              category_name = normalise_text(
                  hotel.get("categoryName")
                  or hotel.get("categoryDescription")
              ).lower()

              for stars in (5, 4, 3, 2, 1):
                  if str(stars) in category_name:
                      return stars

              return None

          def extract_hotels(data):
              # Hotelbeds responses can differ slightly between endpoints/
              # versions. Handle the common structures safely.

              if isinstance(data, list):
                  return data

              if not isinstance(data, dict):
                  return []

              block = data.get("hotels")

              if isinstance(block, list):
                  return block

              if isinstance(block, dict):
                  nested = block.get("hotels")

                  if isinstance(nested, list):
                      return nested

                  nested = block.get("hotel")

                  if isinstance(nested, list):
                      return nested

                  if isinstance(nested, dict):
                      return [nested]

              hotel = data.get("hotel")

              if isinstance(hotel, list):
                  return hotel

              if isinstance(hotel, dict):
                  return [hotel]

              return []

          def request_hotels(destination_code):
              timestamp = str(int(time.time()))

              signature = hashlib.sha256(
                  f"{API_KEY}{SECRET}{timestamp}".encode("utf-8")
              ).hexdigest()

              params = {
                  "fields": "all",
                  "language": "ENG",
                  "destinationCode": destination_code,
                  "from": 1,
                  "to": 1000,
                  "useSecondaryLanguage": "false",
              }

              url = (
                  "https://api.test.hotelbeds.com/"
                  "hotel-content-api/1.0/hotels?"
                  + urllib.parse.urlencode(params)
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "Api-key": API_KEY,
                      "X-Signature": signature,
                      "User-Agent": "V-deals-scout/1.0",
                  },
                  method="GET",
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=45
                  ) as response:
                      body = response.read().decode("utf-8")

                      print(
                          f"HTTP {response.status} "
                          f"for destination {destination_code}"
                      )

                      return response.status, json.loads(body)

              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      f"HTTP {exc.code} "
                      f"for destination {destination_code}"
                  )

                  print(body[:1500])

                  return exc.code, None

              except Exception as exc:
                  print(
                      f"Request failed for "
                      f"{destination_code}: {exc}"
                  )

                  return 0, None

          def preferred_names(destination_name):
              names = []

              for entry in watchlist:
                  if (
                      entry.get("destination", "").lower()
                      == destination_name.lower()
                  ):
                      names.append(entry.get("name", ""))

              return [x for x in names if x]

          def simplify_hotel(hotel):
              name = normalise_text(hotel.get("name"))

              address = normalise_text(
                  hotel.get("address")
              )

              destination_name = normalise_text(
                  hotel.get("destinationName")
              )

              city = normalise_text(
                  hotel.get("city")
              )

              return {
                  "code": hotel.get("code"),
                  "name": name,
                  "stars": hotel_stars(hotel),
                  "category_code": normalise_text(
                      hotel.get("categoryCode")
                      or hotel.get("category")
                  ),
                  "destination_code": normalise_text(
                      hotel.get("destinationCode")
                  ),
                  "destination_name": destination_name,
                  "city": city,
                  "address": address,
              }

          result = {
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "environment": "Hotelbeds Evaluation",
              "source": "Hotelbeds Content API",
              "destinations": [],
          }

          successful_requests = 0

          for destination in destinations:
              name = destination["name"]
              code = destination["code"]

              print()
              print("=" * 70)
              print(f"Discovering hotels: {name} ({code})")
              print("=" * 70)

              status, data = request_hotels(code)

              if status != 200 or data is None:
                  result["destinations"].append({
                      "name": name,
                      "code": code,
                      "http_status": status,
                      "hotel_count": 0,
                      "preferred_matches": [],
                      "shortlist": [],
                  })

                  # Avoid hammering the evaluation API.
                  time.sleep(1)
                  continue

              successful_requests += 1

              raw_hotels = extract_hotels(data)

              hotels = [
                  simplify_hotel(h)
                  for h in raw_hotels
                  if isinstance(h, dict)
              ]

              hotels = [
                  h for h in hotels
                  if h.get("code") and h.get("name")
              ]

              wanted_names = preferred_names(name)

              matches = []

              for target in wanted_names:
                  target_lower = target.lower()

                  possible = [
                      h for h in hotels
                      if (
                          target_lower in h["name"].lower()
                          or h["name"].lower()
                          in target_lower
                      )
                  ]

                  for hotel in possible:
                      item = dict(hotel)
                      item["watchlist_name"] = target

                      if not any(
                          m.get("code") == item.get("code")
                          for m in matches
                      ):
                          matches.append(item)

              # Prefer 5-star, then 4-star properties.
              luxury = [
                  h for h in hotels
                  if (h.get("stars") or 0) >= 4
              ]

              luxury.sort(
                  key=lambda h: (
                      -(h.get("stars") or 0),
                      h.get("name", "").lower(),
                  )
              )

              shortlist = luxury[:40]

              result["destinations"].append({
                  "name": name,
                  "code": code,
                  "http_status": status,
                  "hotel_count": len(hotels),
                  "preferred_matches": matches,
                  "shortlist": shortlist,
              })

              print(f"Hotels returned: {len(hotels)}")
              print(
                  f"4/5-star shortlist: {len(shortlist)}"
              )
              print(
                  f"Watchlist matches: {len(matches)}"
              )

              if matches:
                  print()
                  print("WATCHLIST MATCHES")

                  for hotel in matches:
                      print(
                          f"- {hotel['name']} "
                          f"| code={hotel['code']} "
                          f"| stars={hotel.get('stars')}"
                      )

              if shortlist:
                  print()
                  print("TOP HOTELBED CONTENT RESULTS")

                  for hotel in shortlist[:15]:
                      print(
                          f"- {hotel['name']} "
                          f"| code={hotel['code']} "
                          f"| stars={hotel.get('stars')}"
                      )

              # Protect the evaluation quota.
              time.sleep(1)

          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print()
          print("=" * 70)
          print("DISCOVERY COMPLETE")
          print("=" * 70)
          print(
              f"Successful destination requests: "
              f"{successful_requests}"
          )
          print(
              f"Results saved to: {OUTPUT}"
          )

          if successful_requests == 0:
              raise SystemExit(
                  "No Hotelbeds Content API "
                  "destination requests succeeded."
              )
          PY

      - name: Show discovery summary
        run: |
          python - <<'PY'
          import json

          with open(
              "data/hotelbeds-discovery.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print()
          print("HOTELBEDS HOTEL DISCOVERY")
          print("=" * 70)

          for destination in data["destinations"]:
              print()
              print(
                  f"{destination['name']} "
                  f"({destination['code']})"
              )

              print(
                  f"HTTP status: "
                  f"{destination['http_status']}"
              )

              print(
                  f"Hotels returned: "
                  f"{destination['hotel_count']}"
              )

              matches = destination.get(
                  "preferred_matches",
                  []
              )

              if matches:
                  print("Preferred matches:")

                  for hotel in matches:
                      print(
                          f"  {hotel['name']} "
                          f"→ HOTELBEDS CODE "
                          f"{hotel['code']}"
                      )
              else:
                  print(
                      "Preferred matches: none"
                  )
          PY

      - name: Commit discovery results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/hotelbeds-discovery.json

          if git diff --cached --quiet; then
            echo "No discovery changes to commit"
          else
            git commit -m "Add Hotelbeds hotel discovery results"
            git push
          fi
