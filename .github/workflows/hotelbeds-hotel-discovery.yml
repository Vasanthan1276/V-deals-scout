name: Discover Hotelbeds Hotels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run improved Hotelbeds discovery
        env:
          HOTELBEDS_API_KEY: ${{ secrets.HOTELBEDS_API_KEY }}
          HOTELBEDS_SECRET: ${{ secrets.HOTELBEDS_SECRET }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import hashlib
          import re
          import unicodedata
          import urllib.parse
          import urllib.request
          import urllib.error
          from difflib import SequenceMatcher
          from datetime import datetime, timezone
          from pathlib import Path

          API_KEY = os.environ["HOTELBEDS_API_KEY"]
          SECRET = os.environ["HOTELBEDS_SECRET"]

          BASE = "https://api.test.hotelbeds.com/hotel-content-api/1.0"
          ROOT = Path(".")
          OUTPUT = ROOT / "data" / "hotelbeds-discovery.json"
          HOTEL_CONFIG = ROOT / "config" / "hotels.json"

          # Countries only need to be queried once for destination discovery.
          COUNTRY_CODES = ["SG", "MY", "TH", "ID"]

          DESTINATION_TARGETS = [
              {
                  "name": "Singapore",
                  "country": "SG",
                  "aliases": ["singapore"],
                  "seed_codes": ["SIN"],
              },
              {
                  "name": "Penang",
                  "country": "MY",
                  "aliases": [
                      "penang",
                      "pulau pinang",
                      "george town"
                  ],
                  "seed_codes": ["PEN"],
              },
              {
                  "name": "Kuala Lumpur",
                  "country": "MY",
                  "aliases": [
                      "kuala lumpur"
                  ],
                  "seed_codes": ["KUL"],
              },
              {
                  "name": "Bangkok",
                  "country": "TH",
                  "aliases": [
                      "bangkok"
                  ],
                  "seed_codes": ["BKK"],
              },
              {
                  "name": "Bali",
                  "country": "ID",
                  "aliases": [
                      "bali",
                      "denpasar",
                      "nusa dua"
                  ],
                  "seed_codes": ["DPS"],
              },
              {
                  "name": "Batam",
                  "country": "ID",
                  "aliases": [
                      "batam"
                  ],
                  "seed_codes": ["BTH"],
              },
              {
                  "name": "Bintan",
                  "country": "ID",
                  "aliases": [
                      "bintan",
                      "lagoi",
                      "tanjung pinang"
                  ],
                  "seed_codes": ["TNJ"],
              },
          ]

          def signature():
              timestamp = str(int(time.time()))
              return hashlib.sha256(
                  f"{API_KEY}{SECRET}{timestamp}".encode("utf-8")
              ).hexdigest()

          def api_get(path, params):
              url = (
                  BASE
                  + path
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "Api-key": API_KEY,
                      "X-Signature": signature(),
                      "User-Agent": "V-deals-scout/1.0",
                  },
                  method="GET",
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=60
                  ) as response:
                      body = response.read().decode("utf-8")

                      return (
                          response.status,
                          json.loads(body)
                      )

              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      f"HTTP {exc.code}: "
                      f"{body[:1000]}"
                  )

                  return exc.code, None

              except Exception as exc:
                  print(f"Request error: {exc}")
                  return 0, None

          def text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  return value.strip()

              if isinstance(value, dict):
                  for key in (
                      "content",
                      "name",
                      "description",
                      "value",
                      "text",
                  ):
                      if key in value:
                          return text(value[key])

              return str(value).strip()

          def normalize(value):
              value = text(value).lower()

              value = unicodedata.normalize(
                  "NFKD",
                  value
              )

              value = "".join(
                  c for c in value
                  if not unicodedata.combining(c)
              )

              value = value.replace("&", " and ")

              value = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()

          def similarity(a, b):
              a = normalize(a)
              b = normalize(b)

              if not a or not b:
                  return 0.0

              if a == b:
                  return 1.0

              if a in b or b in a:
                  shorter = min(
                      len(a),
                      len(b)
                  )

                  longer = max(
                      len(a),
                      len(b)
                  )

                  if shorter / longer >= 0.60:
                      return 0.93

              return SequenceMatcher(
                  None,
                  a,
                  b
              ).ratio()

          def load_watchlist():
              if not HOTEL_CONFIG.exists():
                  return []

              with open(
                  HOTEL_CONFIG,
                  "r",
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)

              return data.get(
                  "watchlist",
                  []
              )

          WATCHLIST = load_watchlist()

          def preferred_names(destination):
              return [
                  entry["name"]
                  for entry in WATCHLIST
                  if (
                      entry.get(
                          "destination",
                          ""
                      ).lower()
                      == destination.lower()
                  )
                  and entry.get("name")
              ]

          def extract_destinations(data):
              if not isinstance(data, dict):
                  return []

              destinations = data.get(
                  "destinations",
                  []
              )

              if isinstance(
                  destinations,
                  dict
              ):
                  destinations = destinations.get(
                      "destinations",
                      destinations.get(
                          "destination",
                          []
                      )
                  )

              if isinstance(
                  destinations,
                  dict
              ):
                  return [destinations]

              if isinstance(
                  destinations,
                  list
              ):
                  return destinations

              return []

          def extract_hotels(data):
              if not isinstance(data, dict):
                  return []

              hotels = data.get(
                  "hotels",
                  []
              )

              if isinstance(hotels, dict):
                  hotels = hotels.get(
                      "hotels",
                      hotels.get(
                          "hotel",
                          []
                      )
                  )

              if isinstance(hotels, dict):
                  return [hotels]

              if isinstance(hotels, list):
                  return hotels

              return []

          def star_value(hotel):
              category = normalize(
                  hotel.get(
                      "categoryCode",
                      hotel.get(
                          "category",
                          ""
                      )
                  )
              )

              match = re.match(
                  r"([0-5])",
                  category
              )

              if match:
                  return int(
                      match.group(1)
                  )

              return None

          def simplify_hotel(hotel):
              return {
                  "code": hotel.get("code"),
                  "name": text(
                      hotel.get("name")
                  ),
                  "stars": star_value(
                      hotel
                  ),
                  "category_code": text(
                      hotel.get(
                          "categoryCode",
                          hotel.get(
                              "category"
                          )
                      )
                  ),
                  "destination_code": text(
                      hotel.get(
                          "destinationCode"
                      )
                  ),
                  "country_code": text(
                      hotel.get(
                          "countryCode"
                      )
                  ),
                  "city": text(
                      hotel.get("city")
                  ),
                  "address": text(
                      hotel.get("address")
                  ),
                  "postal_code": text(
                      hotel.get(
                          "postalCode"
                      )
                  ),
              }

          #
          # STEP A
          # Retrieve official Hotelbeds destination catalogue.
          #

          all_destinations = []

          print()
          print("=" * 72)
          print("DISCOVERING OFFICIAL HOTELBEDS DESTINATIONS")
          print("=" * 72)

          for country in COUNTRY_CODES:
              status, data = api_get(
                  "/locations/destinations",
                  {
                      "fields": "all",
                      "language": "ENG",
                      "countryCodes": country,
                      "from": 1,
                      "to": 1000,
                      "useSecondaryLanguage": "false",
                  },
              )

              print(
                  f"{country}: HTTP {status}"
              )

              if status == 200 and data:
                  destinations = (
                      extract_destinations(data)
                  )

                  for item in destinations:
                      all_destinations.append(
                          {
                              "code": text(
                                  item.get("code")
                              ),
                              "name": text(
                                  item.get("name")
                              ),
                              "country_code": text(
                                  item.get(
                                      "countryCode"
                                  )
                              ),
                          }
                      )

                  print(
                      f"  destinations returned: "
                      f"{len(destinations)}"
                  )

              time.sleep(1)

          #
          # Resolve candidate destination codes.
          #

          def destination_candidates(target):
              ranked = []

              for item in all_destinations:
                  if (
                      item["country_code"]
                      != target["country"]
                  ):
                      continue

                  scores = [
                      similarity(
                          item["name"],
                          alias
                      )
                      for alias
                      in target["aliases"]
                  ]

                  score = max(
                      scores or [0]
                  )

                  if score >= 0.63:
                      ranked.append(
                          {
                              **item,
                              "match_score": round(
                                  score,
                                  3
                              ),
                          }
                      )

              ranked.sort(
                  key=lambda x: (
                      -x["match_score"],
                      x["name"].lower()
                  )
              )

              # Keep only top destination matches.
              ranked = ranked[:6]

              known_codes = {
                  x["code"]
                  for x in ranked
              }

              # Retain previously working/assumed codes as
              # fallback candidates.
              for code in target.get(
                  "seed_codes",
                  []
              ):
                  if code not in known_codes:
                      ranked.append(
                          {
                              "code": code,
                              "name": (
                                  "Seed / previous code"
                              ),
                              "country_code": (
                                  target["country"]
                              ),
                              "match_score": 0.50,
                          }
                      )

              return ranked

          #
          # STEP B
          # Retrieve hotel content for each destination.
          #

          results = {
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "environment": (
                  "Hotelbeds Evaluation"
              ),
              "source": (
                  "Hotelbeds Content API"
              ),
              "destinations": [],
          }

          total_hotel_requests = 0
          MAX_HOTEL_REQUESTS = 25

          for target in DESTINATION_TARGETS:
              destination_name = target["name"]
              wanted_hotels = preferred_names(
                  destination_name
              )

              candidates = (
                  destination_candidates(target)
              )

              print()
              print("=" * 72)
              print(
                  f"{destination_name} "
                  f"— candidate destinations"
              )
              print("=" * 72)

              for candidate in candidates:
                  print(
                      f"{candidate['name']} "
                      f"({candidate['code']}) "
                      f"score="
                      f"{candidate['match_score']}"
                  )

              collected = []
              preferred_matches = []

              for candidate in candidates:
                  if (
                      total_hotel_requests
                      >= MAX_HOTEL_REQUESTS
                  ):
                      print(
                          "Hotel request safety "
                          "limit reached."
                      )
                      break

                  destination_code = (
                      candidate["code"]
                  )

                  page_from = 1
                  max_pages = 3

                  for page in range(
                      1,
                      max_pages + 1
                  ):
                      if (
                          total_hotel_requests
                          >= MAX_HOTEL_REQUESTS
                      ):
                          break

                      page_to = (
                          page_from + 999
                      )

                      status, data = api_get(
                          "/hotels",
                          {
                              "fields": "all",
                              "language": "ENG",
                              "destinationCode": (
                                  destination_code
                              ),
                              "from": page_from,
                              "to": page_to,
                              "useSecondaryLanguage": (
                                  "false"
                              ),
                          },
                      )

                      total_hotel_requests += 1

                      print(
                          f"{destination_code} "
                          f"page {page}: "
                          f"HTTP {status}"
                      )

                      if (
                          status != 200
                          or not data
                      ):
                          break

                      raw_hotels = (
                          extract_hotels(data)
                      )

                      simplified = [
                          simplify_hotel(h)
                          for h in raw_hotels
                          if isinstance(h, dict)
                      ]

                      simplified = [
                          h for h in simplified
                          if (
                              h["code"]
                              and h["name"]
                          )
                      ]

                      print(
                          f"  hotels returned: "
                          f"{len(simplified)}"
                      )

                      for hotel in simplified:
                          if not any(
                              existing["code"]
                              == hotel["code"]
                              for existing
                              in collected
                          ):
                              hotel[
                                  "source_destination_code"
                              ] = destination_code

                              collected.append(
                                  hotel
                              )

                      #
                      # Check preferred hotels.
                      #

                      for target_hotel in wanted_hotels:
                          scored = []

                          for hotel in simplified:
                              score = similarity(
                                  target_hotel,
                                  hotel["name"]
                              )

                              if score >= 0.68:
                                  scored.append(
                                      (
                                          score,
                                          hotel
                                      )
                                  )

                          scored.sort(
                              key=lambda x: -x[0]
                          )

                          # Keep multiple Hotelbeds codes
                          # where the same property is mapped
                          # more than once.
                          for score, hotel in scored[:5]:
                              match = dict(hotel)

                              match[
                                  "watchlist_name"
                              ] = target_hotel

                              match[
                                  "match_score"
                              ] = round(
                                  score,
                                  3
                              )

                              if not any(
                                  existing[
                                      "code"
                                  ]
                                  == match["code"]
                                  and existing[
                                      "watchlist_name"
                                  ]
                                  == target_hotel
                                  for existing
                                  in preferred_matches
                              ):
                                  preferred_matches.append(
                                      match
                                  )

                      #
                      # Stop paging early once every preferred
                      # hotel has a strong candidate.
                      #

                      found_targets = {
                          m["watchlist_name"]
                          for m in preferred_matches
                          if (
                              m["match_score"]
                              >= 0.80
                          )
                      }

                      if (
                          wanted_hotels
                          and all(
                              target_name
                              in found_targets
                              for target_name
                              in wanted_hotels
                          )
                      ):
                          break

                      #
                      # If fewer than 1000 records came back,
                      # there is no next page.
                      #

                      if len(simplified) < 1000:
                          break

                      page_from += 1000

                      time.sleep(1)

                  #
                  # If all preferred hotels are already found,
                  # no need to try weaker destination candidates.
                  #

                  found_targets = {
                      m["watchlist_name"]
                      for m in preferred_matches
                      if (
                          m["match_score"]
                          >= 0.80
                      )
                  }

                  if (
                      wanted_hotels
                      and all(
                          target_name
                          in found_targets
                          for target_name
                          in wanted_hotels
                      )
                  ):
                      break

                  time.sleep(1)

              #
              # Sort matches by target then confidence.
              #

              preferred_matches.sort(
                  key=lambda x: (
                      x.get(
                          "watchlist_name",
                          ""
                      ),
                      -x.get(
                          "match_score",
                          0
                      ),
                  )
              )

              #
              # Build 4/5-star discovery shortlist.
              #

              shortlist = [
                  hotel
                  for hotel in collected
                  if (
                      hotel.get("stars")
                      or 0
                  ) >= 4
              ]

              shortlist.sort(
                  key=lambda x: (
                      -(x.get("stars") or 0),
                      x["name"].lower()
                  )
              )

              shortlist = shortlist[:50]

              results[
                  "destinations"
              ].append(
                  {
                      "name": destination_name,
                      "country_code": target[
                          "country"
                      ],
                      "resolved_destination_candidates": (
                          candidates
                      ),
                      "hotel_count_collected": len(
                          collected
                      ),
                      "preferred_matches": (
                          preferred_matches
                      ),
                      "luxury_shortlist": (
                          shortlist
                      ),
                  }
              )

              print()
              print(
                  f"{destination_name}: "
                  f"{len(collected)} "
                  f"unique hotels collected"
              )

              if preferred_matches:
                  print(
                      "PREFERRED HOTEL MATCHES"
                  )

                  for hotel in preferred_matches:
                      print(
                          f"  "
                          f"{hotel['watchlist_name']}"
                          f" -> "
                          f"{hotel['name']}"
                          f" | code="
                          f"{hotel['code']}"
                          f" | score="
                          f"{hotel['match_score']}"
                          f" | city="
                          f"{hotel.get('city','')}"
                          f" | address="
                          f"{hotel.get('address','')}"
                      )
              elif wanted_hotels:
                  print(
                      "No preferred hotel "
                      "matches found."
                  )

          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  results,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print()
          print("=" * 72)
          print("DISCOVERY FINISHED")
          print("=" * 72)
          print(
              f"Hotel requests made: "
              f"{total_hotel_requests}"
          )
          print(
              f"Output: {OUTPUT}"
          )
          PY

      - name: Show preferred hotel summary
        run: |
          python - <<'PY'
          import json

          with open(
              "data/hotelbeds-discovery.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print()
          print("=" * 76)
          print("V&V DEALS SCOUT — HOTELBEDS DISCOVERY SUMMARY")
          print("=" * 76)

          for destination in data["destinations"]:
              print()
              print(destination["name"].upper())

              candidates = destination.get(
                  "resolved_destination_candidates",
                  []
              )

              print("Destination candidates:")

              for candidate in candidates:
                  print(
                      f"  {candidate['name']} "
                      f"→ {candidate['code']} "
                      f"(score "
                      f"{candidate['match_score']})"
                  )

              matches = destination.get(
                  "preferred_matches",
                  []
              )

              if matches:
                  print("Preferred hotels:")

                  for hotel in matches:
                      print(
                          f"  "
                          f"{hotel['watchlist_name']}"
                          f" → "
                          f"{hotel['name']}"
                          f" → CODE "
                          f"{hotel['code']}"
                          f" → confidence "
                          f"{hotel['match_score']}"
                      )
              else:
                  print(
                      "Preferred hotels: "
                      "none"
                  )

              print(
                  "Luxury shortlist count: "
                  f"{len(destination.get('luxury_shortlist', []))}"
              )
          PY

      - name: Commit discovery results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/hotelbeds-discovery.json

          if git diff --cached --quiet; then
            echo "No discovery changes to commit"
          else
            git commit -m "Refine Hotelbeds hotel discovery"
            git push
          fi
